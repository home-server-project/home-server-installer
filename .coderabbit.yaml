language: en
reviews:
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "internal/runner/**"
      instructions: |
        This is the package that owns external command execution. Flag new direct
        exec.Command / exec.CommandContext usage outside the established Runner
        abstraction unless there is a clearly documented reason.

    - path: "internal/tui/**"
      instructions: |
        Keep destructive installation work out of TUI rendering and navigation.
        The TUI may collect and merge user configuration, including the explicit
        live public-SSH-key handoff, but disk partitioning, image pulls, signature
        verification, and bootc installation belong in the install path. Bubble Tea
        owns the interactive terminal; avoid unrelated stdout logging.

    - path: "internal/ignition/**"
      instructions: |
        Treat user-supplied values as security-sensitive. Preserve escaping and
        safe file permissions for generated configuration. Never introduce private
        SSH-key material. Temporary configuration containing credentials or hashes
        must be created safely and cleaned up.

    - path: "internal/install/**"
      instructions: |
        Home Server V1 is a signed direct-install uCore path. Preserve the selected
        target disk as the only disk that may be partitioned, and preserve target
        revalidation immediately before destructive operations. Do not weaken image
        signature verification or broaden trusted repositories accidentally. Home
        Server Project images and upstream Universal Blue uCore images use separate
        trust keys. Installer-only services, temporary trust configuration, and
        scratch state must not persist into the installed system.

    - path: "internal/model/**"
      instructions: |
        Keep this package focused on shared data/state definitions. Avoid adding
        command execution or destructive installer behavior here.

    - path: ".github/workflows/**"
      instructions: |
        Treat workflow changes as security-sensitive. GitHub Actions should remain
        pinned by commit SHA where the repository already follows that pattern.
        Check for secret exposure in run blocks. The V1 public release workflow is
        amd64 and must build the Fedora CoreOS-based installer through
        scripts/build-fcos-iso.sh with no embedded private key or personalized SSH
        key. Preserve Cosign signing, SBOM generation, and provenance for release
        artifacts where currently configured.

    - path: "scripts/build-fcos-iso.sh"
      instructions: |
        This is the Home Server V1 ISO builder. Preserve UEFI boot, use the official
        Fedora CoreOS artifacts obtained through coreos-installer, keep the Knuckle
        executable outside the small live-Ignition payload, verify the packaged
        executable against its SHA256, and preserve the single combined boot initrd
        ordering. --ssh-key accepts public SSH-key material only; private keys must
        never be embedded. Public release builds intentionally omit --ssh-key.

    - path: "scripts/build-iso.sh"
      instructions: |
        This is inherited Knuckle compatibility infrastructure, not the Home Server
        V1 release path. Do not redirect Home Server V1 release or testing work back
        to this script unless that is an explicit design decision.

  tools:
    golangci-lint:
      enabled: true
chat:
  auto_reply: true
