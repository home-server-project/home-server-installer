name: Home Server V1 bootstrap

on:
  push:
    paths:
      - .github/workflows/home-server-v1-bootstrap.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: Recover and apply V1 patch script
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/home-server-v1-bootstrap.yml > /tmp/bootstrap-old.yml
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/bootstrap-old.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start + 1:end]:
              if line.startswith('          '):
                  line = line[10:]
              body.append(line)
          Path('/tmp/apply-home-server-v1.py').write_text('\n'.join(body) + '\n')
          PY
          python3 /tmp/apply-home-server-v1.py

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/model/model.go \
            internal/wizard/wizard.go \
            internal/wizard/home_server_test.go \
            internal/ignition/builder.go \
            internal/ignition/ignition.go \
            internal/ignition/home_server.go \
            internal/ignition/home_server_test.go \
            internal/tui/tui.go \
            internal/tui/forms.go \
            internal/tui/form_logic.go \
            internal/tui/fcos_tui_test.go \
            internal/tui/update_test.go

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          go vet ./...

      - name: Commit V1
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/home-server-v1-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Home Server uCore installer V1"
          git push origin HEAD:main
