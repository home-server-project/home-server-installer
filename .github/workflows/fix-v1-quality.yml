name: Fix V1 quality

on:
  push:
    paths:
      - .github/workflows/fix-v1-quality.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Apply lint fix and coverage tests
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          echo '' | base64 -d > internal/ignition/home_server_coverage_test.go
          echo '' | base64 -d > internal/tui/home_server_coverage_test.go
          gofmt -w internal/tui/tui.go internal/tui/home_server_coverage_test.go internal/ignition/home_server_coverage_test.go

      - name: Unit tests and vet
        run: |
          go test ./...
          go vet ./...

      - name: Coverage gates
        run: just cover-check

      - name: Install and run golangci-lint
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
          golangci-lint run

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-v1-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: satisfy Home Server V1 quality gates"
          git push origin HEAD:main
