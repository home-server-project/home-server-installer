name: Legacy Knuckle VM E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-vm-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-vm-e2e:
    name: Legacy Knuckle compatibility VM E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just

      - name: install just (fallback)
        if: steps.setup-just.outcome == 'failure'
        run: curl -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: install QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run inherited Knuckle VM E2E
        run: just vm-e2e
