name: Finalize V1 lint cleanup

on:
  push:
    paths:
      - .github/workflows/finalize-v1-lint.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3

      - name: Refactor target display name
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("internal/tui/tui.go")
          s = p.read_text()
          s = re.sub(
              r'^\s*//nolint:staticcheck // explicit Home Server target labels are clearer here\.\n',
              '',
              s,
              flags=re.MULTILINE,
          )

          old_install = '''\tvar osName string
          \tif m.Wizard.State.Config.HomeServerImage == model.HomeServerUCoreHCIImage {
          \t\tosName = "Home Server uCore HCI"
          \t} else if m.Wizard.State.Config.HomeServerImage == model.HomeServerUCoreImage {
          \t\tosName = "Home Server uCore"
          \t} else {
          \t\tswitch m.Wizard.State.Config.OS {
          \t\tcase model.OSFCOS:
          \t\t\tosName = "Fedora CoreOS"
          \t\tcase model.OSBluefinDDI:
          \t\t\tosName = "Bluefin Server"
          \t\tdefault:
          \t\t\tosName = "Flatcar Container Linux"
          \t\t}
          \t}
          '''
          new_install = '''\tosName := installTargetDisplayName(&m.Wizard.State.Config)
          '''

          old_done = '''\tvar osName string
          \tif cfg.HomeServerImage == model.HomeServerUCoreHCIImage {
          \t\tosName = "Home Server uCore HCI"
          \t} else if cfg.HomeServerImage == model.HomeServerUCoreImage {
          \t\tosName = "Home Server uCore"
          \t} else {
          \t\tswitch cfg.OS {
          \t\tcase model.OSFCOS:
          \t\t\tosName = "Fedora CoreOS"
          \t\tcase model.OSBluefinDDI:
          \t\t\tosName = "Bluefin Server"
          \t\tdefault:
          \t\t\tosName = "Flatcar Container Linux"
          \t\t}
          \t}
          '''
          new_done = '''\tosName := installTargetDisplayName(cfg)
          '''

          if s.count(old_install) != 1:
              raise SystemExit("viewInstall target-name block not found exactly once")
          if s.count(old_done) != 1:
              raise SystemExit("viewDone target-name block not found exactly once")

          helper = '''func installTargetDisplayName(cfg *model.InstallConfig) string {
          \tswitch cfg.HomeServerImage {
          \tcase model.HomeServerUCoreHCIImage:
          \t\treturn "Home Server uCore HCI"
          \tcase model.HomeServerUCoreImage:
          \t\treturn "Home Server uCore"
          \t}

          \tswitch cfg.OS {
          \tcase model.OSFCOS:
          \t\treturn "Fedora CoreOS"
          \tcase model.OSBluefinDDI:
          \t\treturn "Bluefin Server"
          \tdefault:
          \t\treturn "Flatcar Container Linux"
          \t}
          }

          '''

          marker = 'func (m *Model) viewInstall() string {'
          if s.count(marker) != 1:
              raise SystemExit("viewInstall marker not found exactly once")

          s = s.replace(old_install, new_install, 1)
          s = s.replace(old_done, new_done, 1)
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)
          PY
          gofmt -w internal/tui/tui.go

      - name: Unit tests and vet
        run: |
          go test ./...
          go vet ./...

      - name: Coverage gates
        run: just cover-check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-v1-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: centralize installer target labels"
          git push origin HEAD:main
