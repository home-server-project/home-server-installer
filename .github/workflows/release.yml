# Modified by Home Server Project from Project Bluefin Knuckle.
name: Release Home Server Installer V1

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-amd64:
    name: Build and publish amd64 release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: build installer binary
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -buildvcs=false \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o home-server-installer-linux-amd64 \
            ./cmd/knuckle
          sha256sum home-server-installer-linux-amd64 \
            > home-server-installer-linux-amd64.sha256

      - name: install FCOS ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso mtools cpio systemd-boot-efi
          sudo tee /usr/local/bin/coreos-installer >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm \
            --security-opt label=disable \
            -v "$PWD:$PWD" \
            -w "$PWD" \
            quay.io/coreos/coreos-installer:release "$@"
          EOF
          sudo chmod 0755 /usr/local/bin/coreos-installer
          coreos-installer --version

      - name: build Home Server FCOS installer ISO
        run: |
          set -euo pipefail
          chmod +x ./scripts/build-fcos-iso.sh
          ./scripts/build-fcos-iso.sh \
            --stream stable \
            --arch amd64 \
            --binary ./home-server-installer-linux-amd64

          cp output/knuckle-fcos-installer-stable-amd64.iso \
            home-server-installer-${GITHUB_REF_NAME}-amd64.iso
          sha256sum home-server-installer-${GITHUB_REF_NAME}-amd64.iso \
            > home-server-installer-${GITHUB_REF_NAME}-amd64.iso.sha256

      - name: generate binary SBOM
        run: |
          syft home-server-installer-linux-amd64 \
            --output spdx-json=home-server-installer-linux-amd64.spdx.json \
            --source-name home-server-installer \
            --source-version "${GITHUB_REF_NAME}"

      - name: sign release artifacts with cosign
        run: |
          cosign sign-blob --yes \
            --bundle home-server-installer-linux-amd64.bundle \
            home-server-installer-linux-amd64
          cosign sign-blob --yes \
            --bundle home-server-installer-${GITHUB_REF_NAME}-amd64.iso.bundle \
            home-server-installer-${GITHUB_REF_NAME}-amd64.iso
          cosign sign-blob --yes \
            --bundle home-server-installer-linux-amd64.spdx.json.bundle \
            home-server-installer-linux-amd64.spdx.json

      - name: attest installer binary
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: home-server-installer-linux-amd64

      - name: publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            home-server-installer-linux-amd64
            home-server-installer-linux-amd64.sha256
            home-server-installer-linux-amd64.bundle
            home-server-installer-linux-amd64.spdx.json
            home-server-installer-linux-amd64.spdx.json.bundle
            home-server-installer-${{ github.ref_name }}-amd64.iso
            home-server-installer-${{ github.ref_name }}-amd64.iso.sha256
            home-server-installer-${{ github.ref_name }}-amd64.iso.bundle