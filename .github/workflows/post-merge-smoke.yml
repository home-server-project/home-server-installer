# Modified by Home Server Project from Project Bluefin Knuckle.
name: Post-merge Home Server smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: post-merge-home-server-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bats-smoke:
    name: Home Server FCOS builder smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: run Home Server BATS smoke
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          if ! bats scripts/tests/build-fcos-iso.bats 2>&1 | tee build-fcos-iso.log; then
            echo "failed_test=scripts/tests/build-fcos-iso.bats" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "failed_test=none" >> "$GITHUB_OUTPUT"

      - name: upload smoke log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: post-merge-home-server-smoke-${{ github.run_number }}
          path: build-fcos-iso.log
          retention-days: 14

      - name: open failure issue
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          FAILED_TEST: ${{ steps.smoke.outputs.failed_test }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = `Home Server post-merge smoke failed on main [run: ${context.runNumber}]`;
            const body = [
              'The Home Server FCOS installer builder smoke test failed on `main`.',
              '',
              `- Run: ${process.env.RUN_URL}`,
              `- Commit: \`${context.sha}\``,
              `- Failed test: \`${process.env.FAILED_TEST || 'unknown'}\``,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });