# Modified by Home Server Project from Project Bluefin Knuckle.
name: "Feature request"
description: "Propose an improvement to Home Server Installer."
labels: ["type/feature"]
type: "Feature"
body:
  - type: textarea
    id: problem
    attributes:
      label: "What would you like to improve?"
      description: "Describe the installer problem, missing capability, or workflow you want to improve."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior"
      description: "Describe what the installer should do and what the user should see."
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: "Disk / signing / access impact"
      description: "If relevant, note any effect on target-disk handling, partitioning, image trust/signing, passwords, SSH keys, or Secure Boot."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Extra context"
      description: "Related issues, upstream references, screenshots, or other useful details."
    validations:
      required: false