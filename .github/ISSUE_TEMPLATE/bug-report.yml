name: "Bug report"
description: "Report a problem with Home Server Installer."
labels: ["type/bug"]
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail to reproduce the problem. For install or disk issues, say whether this was a VM or dedicated test hardware and identify the selected target disk.

  - type: textarea
    id: problem
    attributes:
      label: "What happened?"
      description: "Describe what you saw and what you expected instead. Include the exact installer step and any error text."
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Test environment"
      description: "VM or hardware, CPU architecture, firmware/UEFI details, target disk, selected uCore image, and /boot layout when relevant."
      placeholder: |
        VM: libvirt/QEMU
        Architecture: amd64
        Image: Home Server uCore HCI LTS
        Target disk: /dev/vda
        /boot layout: 1 GiB
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs or screenshots"
      description: "Paste relevant installer output, /tmp/knuckle.log excerpts, journal output, or screenshots. Remove private information before posting."
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Extra context"
      description: "Anything else that may help reproduce or narrow the issue."
    validations:
      required: false
